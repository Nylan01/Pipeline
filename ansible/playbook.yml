- name: Déployer le Hello World sur un serveur Nginx
  hosts: web
  become: true

  tasks:
    - name: Installer Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Créer le dossier du site
      ansible.builtin.file:
        path: /var/www/hello
        state: directory
        mode: "0755"

    - name: Copier la page Hello World
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../site/index.html"
        dest: /var/www/hello/index.html
        mode: "0644"

    # Port 8081 car Apache occupe déjà le port 80 sur cette machine
    - name: Configurer le site Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/hello
        content: |
          server {
              listen 8081;
              root /var/www/hello;
              index index.html;
          }
        mode: "0644"

    - name: Activer le site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/hello
        dest: /etc/nginx/sites-enabled/hello
        state: link

    # Le site par défaut de Nginx écoute sur le port 80, déjà pris par Apache
    - name: Désactiver le site par défaut
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Démarrer Nginx avec la nouvelle configuration
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true
